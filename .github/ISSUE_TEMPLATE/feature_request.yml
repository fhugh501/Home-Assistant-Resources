name: Feature request
description: Suggest an improvement or propose a new Dominion Smart Home Systems resource
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. This is a **Dominion-curated** repository. Improvements to existing resources are welcome, and new resource ideas may be considered when they fit the project's scope.

  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      options:
        - Improvement to an existing resource
        - New blueprint idea
        - New dashboard idea
        - New ESPHome or device resource idea
        - New utility or converter idea
        - Documentation improvement
        - Other
    validations:
      required: true

  - type: input
    id: existing_resource
    attributes:
      label: Existing resource, if applicable
      description: Enter the resource name or repository path if this request relates to something already published.
      placeholder: dashboards/trmnl-eink-home-status/

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the real Home Assistant use case or pain point rather than only the proposed implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain what you would like the resource or feature to do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: If you have tried another method, blueprint, integration, card, or workaround, describe it here.

  - type: textarea
    id: dependencies
    attributes:
      label: Relevant integrations, hardware, or dependencies
      description: List anything the proposal would rely on, if known.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add mockups, screenshots, examples, links, or other useful context. Remove sensitive/private information first.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and resources for a similar request.
          required: true
        - label: I understand that new standalone resources are curated by Dominion Smart Home Systems and may not be accepted into the repository.
          required: true
        - label: I have not included passwords, tokens, private URLs, alarm/lock codes, or other sensitive information.
          required: true
