blueprint:
  name: Developer Mode Light Controller
  description: Control one light with runtime fields and a refreshing persistent notification. Supports on, off,
    toggle, status, color, brightness, transition, and optional timed shutoff. Reports Home Assistant state; completion
    does not prove physical convergence.
  domain: script
  author: Dominion Smart Home Systems
  source_url: https://github.com/fhugh501/Home-Assistant-Resources/blob/main/blueprints/script/fhugh501/developer_mode_light_controller.yaml
  homeassistant:
    min_version: 2024.8.0
  input: {}
mode: single
max_exceeded: warning
fields:
  light_entity:
    name: Light
    description: Select one light to control and monitor.
    required: true
    selector:
      entity:
        filter:
          domain: light
  command:
    name: Command
    default: turn_on
    selector:
      select:
        options:
        - turn_on
        - turn_off
        - toggle
        - status
  brightness_pct:
    name: Brightness (%)
    description: Optional. Omit to preserve brightness; zero requests off.
    selector:
      number:
        min: 0
        max: 100
        step: 1
        unit_of_measurement: '%'
        mode: slider
  rgb_color:
    name: RGB color
    description: Optional. Choose RGB or color temperature, not both.
    selector:
      color_rgb: {}
  color_temp_kelvin:
    name: Color temperature (K)
    description: Optional. Must be within the light’s supported range.
    selector:
      number:
        min: 1000
        max: 40000
        step: 1
        unit_of_measurement: K
        mode: box
  effect:
    name: Effect
    description: Optional. Exact effect name from the light’s effect_list attribute.
    selector:
      text: {}
  transition:
    name: Transition (seconds)
    description: Fade time, if supported by the device.
    default: 0
    selector:
      number:
        min: 0
        max: 3600
        step: 1
        unit_of_measurement: s
        mode: box
  duration:
    name: On duration (seconds)
    description: 0 leaves the light on. Otherwise, wait this long after transition monitoring, then turn off using
      the same transition.
    default: 0
    selector:
      number:
        min: 0
        max: 86400
        step: 1
        unit_of_measurement: s
        mode: box
  status_interval:
    name: Status refresh (seconds)
    default: 2
    selector:
      number:
        min: 1
        max: 60
        step: 1
        unit_of_measurement: s
        mode: box
sequence:
- variables:
    entity: '{{ light_entity | default('''') }}'
    operation: '{{ command | default(''turn_on'') }}'
    fade: '{{ transition | default(0) }}'
    hold: '{{ duration | default(0) }}'
    interval: '{{ status_interval | default(2) }}'
    validation_error: |-
      {% set ns = namespace(errors=[]) %}
      {% if entity is not string or not entity.startswith('light.') %}
        {% set ns.errors = ns.errors + ['Select a single light entity.'] %}
      {% endif %}
      {% if operation not in ['turn_on', 'turn_off', 'toggle', 'status'] %}
        {% set ns.errors = ns.errors + ['Invalid command.'] %}
      {% endif %}
      {% for value, low, high, label in [(fade, 0, 3600, 'transition'), (hold, 0, 86400, 'duration'), (interval, 1, 60, 'status_interval')] %}
        {% if value is not number or value is boolean or not (low <= value <= high) %}
          {% set ns.errors = ns.errors + [label ~ ' is outside the allowed numeric range.'] %}
        {% endif %}
      {% endfor %}
      {% if brightness_pct is defined and (brightness_pct is not number or brightness_pct is boolean or not (0 <= brightness_pct <= 100)) %}
        {% set ns.errors = ns.errors + ['Brightness must be a number from 0 to 100.'] %}
      {% endif %}
      {% if rgb_color is defined %}
        {% if rgb_color is not sequence or rgb_color is string or rgb_color is mapping or rgb_color | length != 3 %}
          {% set ns.errors = ns.errors + ['RGB must contain three integers from 0 to 255.'] %}
        {% else %}
          {% for component in rgb_color %}
            {% if component is not integer or component is boolean or not (0 <= component <= 255) %}
              {% set ns.errors = ns.errors + ['RGB components must be integers from 0 to 255.'] %}
            {% endif %}
          {% endfor %}
        {% endif %}
      {% endif %}
      {% if color_temp_kelvin is defined and (color_temp_kelvin is not number or color_temp_kelvin is boolean or not (1000 <= color_temp_kelvin <= 40000)) %}
        {% set ns.errors = ns.errors + ['Color temperature must be a number from 1000 to 40000 K.'] %}
      {% endif %}
      {% if rgb_color is defined and color_temp_kelvin is defined %}
        {% set ns.errors = ns.errors + ['Choose RGB or color temperature, not both.'] %}
      {% endif %}
      {% if effect is defined and effect is not string %}
        {% set ns.errors = ns.errors + ['Effect must be a string.'] %}
      {% endif %}
      {{ ns.errors | join(' ') }}
- if:
  - condition: template
    value_template: '{{ validation_error | trim != '''' }}'
  then:
  - action: persistent_notification.create
    data:
      title: Developer Mode Light Controller — invalid request
      message: '{{ validation_error }}'
  - stop: '{{ validation_error }}'
    error: true
- variables:
    notification_key: '{{ ''dominion_light_control_'' ~ this.entity_id }}'
    resolved: '{{ (''turn_off'' if states(entity) == ''on'' else ''turn_on'') if operation == ''toggle'' else operation
      }}'
- if:
  - condition: template
    value_template: '{{ operation != ''status'' and states(entity) not in [''on'', ''off''] }}'
  then:
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_key }}'
      title: Developer Mode Light Controller — unavailable
      message: '{{ entity }} reports {{ states(entity) }}. No light action was sent.'
  - stop: Selected light is missing, unknown, or unavailable.
    error: true
- if:
  - condition: template
    value_template: '{{ operation != ''status'' }}'
  then:
  - variables:
      service_data: |-
        {% set ns = namespace(data=dict(transition=fade)) %}
        {% if resolved == 'turn_on' %}
          {% if brightness_pct is defined %}{% set ns.data = dict(ns.data, brightness_pct=brightness_pct) %}{% endif %}
          {% if rgb_color is defined %}{% set ns.data = dict(ns.data, rgb_color=rgb_color) %}{% endif %}
          {% if color_temp_kelvin is defined %}{% set ns.data = dict(ns.data, color_temp_kelvin=color_temp_kelvin) %}{% endif %}
          {% if effect is defined and effect | length > 0 %}{% set ns.data = dict(ns.data, effect=effect) %}{% endif %}
        {% endif %}
        {{ ns.data }}
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_key }}'
      title: Developer Mode Light Controller — {{ entity }}
      message: |-
        Phase: Sending request
        Updated: {{ now().isoformat() }}
        Command: {{ operation }}; resolved action: {{ resolved }}
        Requested brightness: {{ brightness_pct | default('unchanged') }}%
        Requested RGB: {{ rgb_color | default('unchanged') }}
        Requested temperature: {{ color_temp_kelvin | default('unchanged') }} K
        Requested effect: {{ effect | default('unchanged') }}
        Transition: {{ fade }} s; on duration: {{ hold }} s
        Reported state: {{ states(entity) }}
        Reported brightness: {{ ((state_attr(entity, 'brightness') | float / 255 * 100) | round(1)) if state_attr(entity, 'brightness') is number else 'not reported' }}%
        Reported RGB: {{ state_attr(entity, 'rgb_color') }}
        Reported temperature: {{ state_attr(entity, 'color_temp_kelvin') }} K
        Reported effect: {{ state_attr(entity, 'effect') }}
        Reported color mode: {{ state_attr(entity, 'color_mode') }}
        These are Home Assistant reports, not measured physical fade progress.
        If the script stops before the final report, check its trace for errors.
  - action: '{{ ''light.'' ~ resolved }}'
    target:
      entity_id: '{{ entity }}'
    data: '{{ service_data }}'
  - variables:
      phase_started: '{{ as_timestamp(now()) }}'
      phase_seconds: '{{ fade + 2 }}'
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_key }}'
      title: Developer Mode Light Controller — {{ entity }}
      message: |-
        Phase: Observing adjustment
        Phase elapsed: {{ (as_timestamp(now()) - phase_started) | round(1) }} s; remaining: {{ [0, phase_seconds - (as_timestamp(now()) - phase_started)] | max | round(1) }} s (timer only)
        Updated: {{ now().isoformat() }}
        Command: {{ operation }}; resolved action: {{ resolved }}
        Requested brightness: {{ brightness_pct | default('unchanged') }}%
        Requested RGB: {{ rgb_color | default('unchanged') }}
        Requested temperature: {{ color_temp_kelvin | default('unchanged') }} K
        Requested effect: {{ effect | default('unchanged') }}
        Transition: {{ fade }} s; on duration: {{ hold }} s
        Reported state: {{ states(entity) }}
        Reported brightness: {{ ((state_attr(entity, 'brightness') | float / 255 * 100) | round(1)) if state_attr(entity, 'brightness') is number else 'not reported' }}%
        Reported RGB: {{ state_attr(entity, 'rgb_color') }}
        Reported temperature: {{ state_attr(entity, 'color_temp_kelvin') }} K
        Reported effect: {{ state_attr(entity, 'effect') }}
        Reported color mode: {{ state_attr(entity, 'color_mode') }}
        These are Home Assistant reports, not measured physical fade progress.
        If the script stops before the final report, check its trace for errors.
  - repeat:
      while:
      - condition: template
        value_template: '{{ as_timestamp(now()) - phase_started < phase_seconds }}'
      sequence:
      - delay:
          seconds: '{{ [interval, [0, phase_seconds - (as_timestamp(now()) - phase_started)] | max] | min }}'
      - action: persistent_notification.create
        data:
          notification_id: '{{ notification_key }}'
          title: Developer Mode Light Controller — {{ entity }}
          message: |-
            Phase: Observing adjustment
            Phase elapsed: {{ (as_timestamp(now()) - phase_started) | round(1) }} s; remaining: {{ [0, phase_seconds - (as_timestamp(now()) - phase_started)] | max | round(1) }} s (timer only)
            Updated: {{ now().isoformat() }}
            Command: {{ operation }}; resolved action: {{ resolved }}
            Requested brightness: {{ brightness_pct | default('unchanged') }}%
            Requested RGB: {{ rgb_color | default('unchanged') }}
            Requested temperature: {{ color_temp_kelvin | default('unchanged') }} K
            Requested effect: {{ effect | default('unchanged') }}
            Transition: {{ fade }} s; on duration: {{ hold }} s
            Reported state: {{ states(entity) }}
            Reported brightness: {{ ((state_attr(entity, 'brightness') | float / 255 * 100) | round(1)) if state_attr(entity, 'brightness') is number else 'not reported' }}%
            Reported RGB: {{ state_attr(entity, 'rgb_color') }}
            Reported temperature: {{ state_attr(entity, 'color_temp_kelvin') }} K
            Reported effect: {{ state_attr(entity, 'effect') }}
            Reported color mode: {{ state_attr(entity, 'color_mode') }}
            These are Home Assistant reports, not measured physical fade progress.
            If the script stops before the final report, check its trace for errors.
  - if:
    - condition: template
      value_template: '{{ resolved == ''turn_on'' and hold > 0 and (brightness_pct | default(100)) > 0 }}'
    then:
    - variables:
        phase_started: '{{ as_timestamp(now()) }}'
        phase_seconds: '{{ hold }}'
    - action: persistent_notification.create
      data:
        notification_id: '{{ notification_key }}'
        title: Developer Mode Light Controller — {{ entity }}
        message: |-
          Phase: Waiting for timed shutoff
          Phase elapsed: {{ (as_timestamp(now()) - phase_started) | round(1) }} s; remaining: {{ [0, phase_seconds - (as_timestamp(now()) - phase_started)] | max | round(1) }} s (timer only)
          Updated: {{ now().isoformat() }}
          Command: {{ operation }}; resolved action: {{ resolved }}
          Requested brightness: {{ brightness_pct | default('unchanged') }}%
          Requested RGB: {{ rgb_color | default('unchanged') }}
          Requested temperature: {{ color_temp_kelvin | default('unchanged') }} K
          Requested effect: {{ effect | default('unchanged') }}
          Transition: {{ fade }} s; on duration: {{ hold }} s
          Reported state: {{ states(entity) }}
          Reported brightness: {{ ((state_attr(entity, 'brightness') | float / 255 * 100) | round(1)) if state_attr(entity, 'brightness') is number else 'not reported' }}%
          Reported RGB: {{ state_attr(entity, 'rgb_color') }}
          Reported temperature: {{ state_attr(entity, 'color_temp_kelvin') }} K
          Reported effect: {{ state_attr(entity, 'effect') }}
          Reported color mode: {{ state_attr(entity, 'color_mode') }}
          These are Home Assistant reports, not measured physical fade progress.
          If the script stops before the final report, check its trace for errors.
    - repeat:
        while:
        - condition: template
          value_template: '{{ as_timestamp(now()) - phase_started < phase_seconds }}'
        sequence:
        - delay:
            seconds: '{{ [interval, [0, phase_seconds - (as_timestamp(now()) - phase_started)] | max] | min }}'
        - action: persistent_notification.create
          data:
            notification_id: '{{ notification_key }}'
            title: Developer Mode Light Controller — {{ entity }}
            message: |-
              Phase: Waiting for timed shutoff
              Phase elapsed: {{ (as_timestamp(now()) - phase_started) | round(1) }} s; remaining: {{ [0, phase_seconds - (as_timestamp(now()) - phase_started)] | max | round(1) }} s (timer only)
              Updated: {{ now().isoformat() }}
              Command: {{ operation }}; resolved action: {{ resolved }}
              Requested brightness: {{ brightness_pct | default('unchanged') }}%
              Requested RGB: {{ rgb_color | default('unchanged') }}
              Requested temperature: {{ color_temp_kelvin | default('unchanged') }} K
              Requested effect: {{ effect | default('unchanged') }}
              Transition: {{ fade }} s; on duration: {{ hold }} s
              Reported state: {{ states(entity) }}
              Reported brightness: {{ ((state_attr(entity, 'brightness') | float / 255 * 100) | round(1)) if state_attr(entity, 'brightness') is number else 'not reported' }}%
              Reported RGB: {{ state_attr(entity, 'rgb_color') }}
              Reported temperature: {{ state_attr(entity, 'color_temp_kelvin') }} K
              Reported effect: {{ state_attr(entity, 'effect') }}
              Reported color mode: {{ state_attr(entity, 'color_mode') }}
              These are Home Assistant reports, not measured physical fade progress.
              If the script stops before the final report, check its trace for errors.
    - action: persistent_notification.create
      data:
        notification_id: '{{ notification_key }}'
        title: Developer Mode Light Controller — {{ entity }}
        message: |-
          Phase: Sending timed shutoff
          Updated: {{ now().isoformat() }}
          Command: {{ operation }}; resolved action: {{ resolved }}
          Requested brightness: {{ brightness_pct | default('unchanged') }}%
          Requested RGB: {{ rgb_color | default('unchanged') }}
          Requested temperature: {{ color_temp_kelvin | default('unchanged') }} K
          Requested effect: {{ effect | default('unchanged') }}
          Transition: {{ fade }} s; on duration: {{ hold }} s
          Reported state: {{ states(entity) }}
          Reported brightness: {{ ((state_attr(entity, 'brightness') | float / 255 * 100) | round(1)) if state_attr(entity, 'brightness') is number else 'not reported' }}%
          Reported RGB: {{ state_attr(entity, 'rgb_color') }}
          Reported temperature: {{ state_attr(entity, 'color_temp_kelvin') }} K
          Reported effect: {{ state_attr(entity, 'effect') }}
          Reported color mode: {{ state_attr(entity, 'color_mode') }}
          These are Home Assistant reports, not measured physical fade progress.
          If the script stops before the final report, check its trace for errors.
    - action: light.turn_off
      target:
        entity_id: '{{ entity }}'
      data:
        transition: '{{ fade }}'
    - variables:
        phase_started: '{{ as_timestamp(now()) }}'
        phase_seconds: '{{ fade + 2 }}'
    - action: persistent_notification.create
      data:
        notification_id: '{{ notification_key }}'
        title: Developer Mode Light Controller — {{ entity }}
        message: |-
          Phase: Observing timed shutoff
          Phase elapsed: {{ (as_timestamp(now()) - phase_started) | round(1) }} s; remaining: {{ [0, phase_seconds - (as_timestamp(now()) - phase_started)] | max | round(1) }} s (timer only)
          Updated: {{ now().isoformat() }}
          Command: {{ operation }}; resolved action: {{ resolved }}
          Requested brightness: {{ brightness_pct | default('unchanged') }}%
          Requested RGB: {{ rgb_color | default('unchanged') }}
          Requested temperature: {{ color_temp_kelvin | default('unchanged') }} K
          Requested effect: {{ effect | default('unchanged') }}
          Transition: {{ fade }} s; on duration: {{ hold }} s
          Reported state: {{ states(entity) }}
          Reported brightness: {{ ((state_attr(entity, 'brightness') | float / 255 * 100) | round(1)) if state_attr(entity, 'brightness') is number else 'not reported' }}%
          Reported RGB: {{ state_attr(entity, 'rgb_color') }}
          Reported temperature: {{ state_attr(entity, 'color_temp_kelvin') }} K
          Reported effect: {{ state_attr(entity, 'effect') }}
          Reported color mode: {{ state_attr(entity, 'color_mode') }}
          These are Home Assistant reports, not measured physical fade progress.
          If the script stops before the final report, check its trace for errors.
    - repeat:
        while:
        - condition: template
          value_template: '{{ as_timestamp(now()) - phase_started < phase_seconds }}'
        sequence:
        - delay:
            seconds: '{{ [interval, [0, phase_seconds - (as_timestamp(now()) - phase_started)] | max] | min }}'
        - action: persistent_notification.create
          data:
            notification_id: '{{ notification_key }}'
            title: Developer Mode Light Controller — {{ entity }}
            message: |-
              Phase: Observing timed shutoff
              Phase elapsed: {{ (as_timestamp(now()) - phase_started) | round(1) }} s; remaining: {{ [0, phase_seconds - (as_timestamp(now()) - phase_started)] | max | round(1) }} s (timer only)
              Updated: {{ now().isoformat() }}
              Command: {{ operation }}; resolved action: {{ resolved }}
              Requested brightness: {{ brightness_pct | default('unchanged') }}%
              Requested RGB: {{ rgb_color | default('unchanged') }}
              Requested temperature: {{ color_temp_kelvin | default('unchanged') }} K
              Requested effect: {{ effect | default('unchanged') }}
              Transition: {{ fade }} s; on duration: {{ hold }} s
              Reported state: {{ states(entity) }}
              Reported brightness: {{ ((state_attr(entity, 'brightness') | float / 255 * 100) | round(1)) if state_attr(entity, 'brightness') is number else 'not reported' }}%
              Reported RGB: {{ state_attr(entity, 'rgb_color') }}
              Reported temperature: {{ state_attr(entity, 'color_temp_kelvin') }} K
              Reported effect: {{ state_attr(entity, 'effect') }}
              Reported color mode: {{ state_attr(entity, 'color_mode') }}
              These are Home Assistant reports, not measured physical fade progress.
              If the script stops before the final report, check its trace for errors.
- variables:
    result: |-
      {{ dict(entity_id=entity, state=states(entity),
        available=states(entity) in ['on', 'off'],
        brightness_pct=((state_attr(entity, 'brightness') | float / 255 * 100) | round(1)
          if state_attr(entity, 'brightness') is number else none),
        rgb_color=state_attr(entity, 'rgb_color'),
        color_temp_kelvin=state_attr(entity, 'color_temp_kelvin'),
        color_mode=state_attr(entity, 'color_mode'),
        effect=state_attr(entity, 'effect'),
        supported_color_modes=state_attr(entity, 'supported_color_modes'),
        effect_list=state_attr(entity, 'effect_list'),
        observed_at=now().isoformat()) }}
- action: persistent_notification.create
  data:
    notification_id: '{{ notification_key }}'
    title: Developer Mode Light Controller — {{ entity }}
    message: |-
      Phase: Final report — observation window ended; inspect reported values
      Updated: {{ now().isoformat() }}
      Command: {{ operation }}; resolved action: {{ resolved }}
      Requested brightness: {{ brightness_pct | default('unchanged') }}%
      Requested RGB: {{ rgb_color | default('unchanged') }}
      Requested temperature: {{ color_temp_kelvin | default('unchanged') }} K
      Requested effect: {{ effect | default('unchanged') }}
      Transition: {{ fade }} s; on duration: {{ hold }} s
      Reported state: {{ states(entity) }}
      Reported brightness: {{ ((state_attr(entity, 'brightness') | float / 255 * 100) | round(1)) if state_attr(entity, 'brightness') is number else 'not reported' }}%
      Reported RGB: {{ state_attr(entity, 'rgb_color') }}
      Reported temperature: {{ state_attr(entity, 'color_temp_kelvin') }} K
      Reported effect: {{ state_attr(entity, 'effect') }}
      Reported color mode: {{ state_attr(entity, 'color_mode') }}
      These are Home Assistant reports, not measured physical fade progress.
      If the script stops before the final report, check its trace for errors.
- stop: Returning reported light status.
  response_variable: result
